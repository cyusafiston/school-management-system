<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record Payment - Accountant Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5" style="max-width: 650px;">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0">Record Student Payment</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'accountant_dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
                        <button type="submit" class="btn btn-success px-4">Save Payment</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
